sensors:
  - pointcloud_octomap_updater
pointcloud_octomap_updater:
  filtered_cloud_topic: filtered_cloud
  max_range: 2.0
  max_update_rate: 1.0
  padding_offset: 0.1
  padding_scale: 1.0
  point_cloud_topic: /throttle_filtering_points/filtered_points
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater